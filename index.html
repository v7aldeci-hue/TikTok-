<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zilem - المحرك الحقيقي</title>
    <!-- استدعاء محرك المعالجة الحقيقي -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.9.6/dist/ffmpeg.min.js"></script>
    <style>
        :root {
            --bg-color: #0c0d12;
            --card-bg: #141620;
            --border-color: #232733;
            --accent: #38bdf8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --insta: #e1306c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; text-align: center; }
        p { font-size: 13px; color: var(--text-muted); text-align: center; line-height: 1.5; margin-bottom: 20px; }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: block;
            box-sizing: border-box;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-insta { background-color: var(--insta); color: white; margin-top: 15px; }
        .btn-success { background-color: #10b981; color: white; margin-top: 15px; }

        .engines { display: flex; gap: 10px; margin-bottom: 15px; }
        .engine-card {
            flex: 1; background: #1c1f2e; border: 1px solid var(--border-color);
            border-radius: 10px; padding: 10px; text-align: center; font-size: 12px; border-color: var(--accent);
        }

        .dropzone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: #0f1118;
            cursor: pointer;
            margin-bottom: 15px;
        }
        input[type="file"] { display: none; }

        .terminal {
            background: #090a0f; border: 1px solid var(--border-color); border-radius: 8px;
            padding: 12px; font-family: monospace; font-size: 12px; color: var(--accent);
            text-align: left; direction: ltr; margin-top: 15px; display: none;
        }
    </style>
</head>
<body>

    <!-- شاشة قفل الانستغرام -->
    <div id="lockScreen" class="container">
        <h1>🔒 الموقع مقفول مؤقتاً</h1>
        <p>لبدء استخدام محرك تصحيح الفيديوهات ورفعها بدون فقدان الجودة، يرجى متابعة حسابنا على انستغرام أولاً.</p>
        <button onclick="unlockSite()" class="btn btn-insta">📸 متابعة الحساب وفتح الموقع</button>
    </div>

    <!-- واجهة الموقع الأساسية -->
    <div id="mainApp" class="container" style="display: none;">
        <h1>التصحيح محرك ⚡</h1>
        <p>إعادة كتابة ملف MP4 الداخلي (moov atom) لتوافق خوارزمية TikTok. لا يتم تغيير أي بكسلات، ولا تفقد أي جودة.</p>
        
        <div class="engines">
            <div class="engine-card">
                <b>محرك Z-Patch الحقيقي</b><br><span style="color:var(--text-muted)">بدون رندر · Client-Side</span>
            </div>
        </div>

        <label for="videoUpload" class="dropzone" style="display: block;">
            <div style="font-size: 22px; margin-bottom: 5px;">📁</div>
            <div style="font-weight: 600; font-size: 14px;">أفلت الفيديو هنا أو اضغط للاختيار</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 3px;">MP4 & MOV (تتم المعالجة فوراً)</div>
        </label>
        <input type="file" id="videoUpload" accept="video/mp4,video/quicktime,video/*">

        <div id="terminal" class="terminal"></div>
        <div id="downloadArea"></div>
    </div>

    <script>
        function unlockSite() {
            // غير YOUR_USERNAME بيوزر انستغرام مالك
            window.open("https://instagram.com/YOUR_USERNAME", "_blank");
            setTimeout(() => {
                document.getElementById("lockScreen").style.display = "none";
                document.getElementById("mainApp").style.display = "block";
            }, 3000);
        }

        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: false });

        document.getElementById('videoUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const terminal = document.getElementById('terminal');
            const downloadArea = document.getElementById('downloadArea');
            terminal.style.display = 'block';
            downloadArea.innerHTML = '';
            
            terminal.innerHTML = `> التهيئة: تحميل ملف ${file.name}...<br>`;

            try {
                if (!ffmpeg.isLoaded()) {
                    terminal.innerHTML += `> جاري تشغيل المحرك الأساسي...<br>`;
                    await ffmpeg.load();
                }

                terminal.innerHTML += `> قراءة البيانات الوصفية (Metadata)...<br>`;
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));

                terminal.innerHTML += `> حقن خوارزمية (Faststart Moov Atom) بدون رندر...<br>`;
                
                // الكود الحقيقي السري: ينسخ الفيديو بدون رندر (-c copy) ويغير التوقيع (+faststart)
                await ffmpeg.run('-i', 'input.mp4', '-c', 'copy', '-movflags', '+faststart', 'output.mp4');

                terminal.innerHTML += `> <span style="color: #10b981;">اكتملت المعالجة بنجاح!</span>`;

                const data = ffmpeg.FS('readFile', 'output.mp4');
                const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(videoBlob);

                downloadArea.innerHTML = `
                    <a href="${videoUrl}" download="Patched_${file.name}" class="btn btn-success">
                        ✅ تحميل الفيديو المصحح
                    </a>
                `;

            } catch (error) {
                terminal.innerHTML += `> <span style="color: red;">خطأ: الصيغة غير مدعومة. يرجى استخدام MP4.</span>`;
                console.error(error);
            }
        });
    </script>
</body>
</html>
